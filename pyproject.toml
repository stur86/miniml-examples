[project]
name = "miniml-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Simone Sturniolo", email = "simonesturniolo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "erlenmeyer>=0.3.0",
    "marimo>=0.24.0",
    "matplotlib>=3.11.1",
    "miniml-jax>=0.10.0",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
erlenmeyer = { git = "https://github.com/stur86/erlenmeyer.git", branch = "master" }
